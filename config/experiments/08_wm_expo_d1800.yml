extends: "../base.yml"

# Famiglia wm_expo (vedi 06_wm_expo_d0): mu = 1800, cambia solo d.
#
# d = 1800 = mu -> loss ~ 13.0% * e^(-1) ~ 4.8%

experiment:
  name: "08_wm_expo_d1800"
  output_dir_host: "Results/experiments"

producer:
  holdback_probability: 0.3
  holdback_delay: 14400.0
  holdback_distribution: "exponential"
  holdback_mean_seconds: 1800.0

flink:
  auto_watermark_interval_ms: 1
  python_bundle_time_ms: 50       # bundle Python: watermark quantizzato a ~576 s event (vs 16 h col default 1000 ms)

# Stesso ritardo ammesso per tutte le query.
q1:
  watermark_delay_seconds: 1800
q2:
  window: "1h"   # 1h | 6h | global | all
  watermark_delay_seconds: 1800
q3:
  window: "1d"  # 1d | 7d | global | all
  watermark_delay_seconds: 1800
