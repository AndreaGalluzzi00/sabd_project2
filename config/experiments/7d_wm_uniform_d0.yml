extends: "../base.yml"

# Famiglia wm_uniform: disordine uniforme in [0, D] s di event-time,
# D = 3600 = W (finestra oraria di Q1). Producer e seed identici in tutta
# la famiglia: tra un esperimento e l'altro cambia SOLO d (watermark).
# Perdita attesa (G trascurabile): loss = p * (D - d)^2 / (2 * D * W);
# vale per W = 3600 s (Q1, Q2-1h); per finestre piu' lunghe scala ~ 1/W.
#
# d = 0: watermark piu' aggressivo possibile -> latenza dei risultati minima.
# NB: non scarta "tutti" gli eventi ritardati (30%): chi resta dentro la
# propria finestra non e' mai late. Massimo teorico = p/2:
#   loss = 0.3 * 3600^2 / (2 * 3600 * 3600) = 15%
# Con d = 0 il budget effettivo e' ~G (1 ms * accel ~ 58 s) -> atteso ~14.7%.

experiment:
  name: "7d_wm_uniform_d0"
  output_dir_host: "Results/experiments"

producer:
  holdback_probability: 0.3
  holdback_delay: 604800.0          # disordine uniforme in [0, 3600] s di event-time
  holdback_distribution: "uniform"

flink:
  auto_watermark_interval_ms: 1   # G = 1ms * accel ~ 58 s
  python_bundle_time_ms: 50       # bundle Python: watermark quantizzato a ~576 s event (vs 16 h col default 1000 ms)

q3:
  window: "1d"  # 1d | 7d | global | all
  watermark_delay_seconds: 0