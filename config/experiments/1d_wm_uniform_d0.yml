extends: "../base.yml"



experiment:
  name: "1d_wm_uniform_d0"
  output_dir_host: "Results/experiments"

producer:
  holdback_probability: 0.3
  holdback_delay: 86400.0          # disordine uniforme in [0, 3600] s di event-time
  holdback_distribution: "uniform"

flink:
  auto_watermark_interval_ms: 1   # G = 1ms * accel ~ 58 s
  python_bundle_time_ms: 50       # bundle Python: watermark quantizzato a ~576 s event (vs 16 h col default 1000 ms)

q3:
  window: "1d"  # 1d | 7d | global | all
  watermark_delay_seconds: 0