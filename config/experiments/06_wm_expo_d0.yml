extends: "../base.yml"

# Famiglia wm_expo: disordine esponenziale con media mu = 1800 s di
# event-time (stessa media del caso uniforme [0, 3600] -> primo momento
# uguale, cambia solo la forma della coda). holdback_delay = 14400 e' solo
# il cap tecnico del clamp del producer: non altera la perdita attesa per
# d <= 3600, perche' ogni delta >= W + d e' comunque late.
# Perdita attesa (G trascurabile, W = 3600):
#   loss = p * e^(-d/mu) * (mu/W) * (1 - e^(-W/mu)) ~ 13.0% * e^(-d/1800)
#
# d = 0 -> loss ~ 13.0%. Stesso caveat di 02: budget effettivo ~G (~58 s).

experiment:
  name: "06_wm_expo_d0"
  output_dir_host: "Results/experiments"

producer:
  holdback_probability: 0.3
  holdback_delay: 14400.0         # cap del clamp, ininfluente per d <= 3600
  holdback_distribution: "exponential"
  holdback_mean_seconds: 1800.0   # stessa media del disordine uniforme

flink:
  auto_watermark_interval_ms: 1
  python_bundle_time_ms: 10       # bundle Python: watermark quantizzato a ~576 s event (vs 16 h col default 1000 ms)

# Stesso ritardo ammesso per tutte le query.
q1:
  watermark_delay_seconds: 0
q2:
  watermark_delay_seconds: 0
q3:
  watermark_delay_seconds: 0
