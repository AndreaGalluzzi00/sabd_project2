# Telegraf: bridge Kafka -> InfluxDB per le dashboard real-time di Q1, Q2 e Q3.
#
# Q1: consuma le finestre dal topic 'q1_results' (JSON prodotto dal sink Kafka
# del job Flink) e le scrive come misurazione 'q1' su InfluxDB.
#
# Q2: topic q2_results_1h / _6h / _global / _cumulative, una misurazione per finestra:
#   measurement = "q2_1h" | "q2_6h" | "q2_global" | "q2_cumulative"
#   tag         = origin_airport_id, airport_rank per 1h/6h/global; solo
#                 airport_rank per cumulative, cosi' il rank live viene sovrascritto
#   time        = ts  (inizio finestra, event-time)
#   field       = num_flights, severe_delays, dep_delay_mean, dep_delay_max,
#                 origin_airport_id per cumulative, delayed_flights (string)
#
# Modello dati su InfluxDB:
#   measurement = "q1"
#   tag         = airline
#   time        = window_start  (event-time della finestra, NON il wall-clock)
#   field       = num_flights, completed, cancelled, diverted, dep_delay_mean,
#                 cancellation_rate, late_departure_rate
#
# Q3: topic q3_results_1d / _7d / _global / _cumulative, una misurazione per finestra:
#   measurement = "q3_1d" | "q3_7d" | "q3_global" | "q3_cumulative"
#   tag         = airline, hour   (hour è emesso come stringa dal sink Flink:
#                 il parser JSON di Telegraf accetta solo stringhe come tag)
#   time        = ts  (inizio finestra, event-time)
#   field       = num_flights, delay_min, p25, p50, p75, p90, delay_max
#
# window_start/ts è usato come timestamp del punto: in Grafana imposta il time
# range sul periodo del dataset (gen–apr 2025) per vedere le curve costruirsi live.

[agent]
  interval = "5s"
  flush_interval = "5s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  omit_hostname = true

[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["q1_results"]
  consumer_group = "telegraf-q1"
  # 'oldest' = leggi dall'inizio del topic, così non si perdono le prime finestre
  # prodotte prima che Telegraf si iscriva.
  offset = "oldest"

  data_format = "json"
  name_override = "q1"
  tag_keys = ["airline"]
  json_time_key = "window_start"
  json_time_format = "2006-01-02 15:04:05"
  json_timezone = "UTC"

# ── Q2: un consumer per finestra (consumer group separati) ──────────────────

[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["q2_results_1h"]
  consumer_group = "telegraf-q2-1h"
  offset = "oldest"

  data_format = "json"
  name_override = "q2_1h"
  tag_keys = ["origin_airport_id", "airport_rank"]
  json_string_fields = ["delayed_flights"]
  json_time_key = "ts"
  json_time_format = "2006-01-02 15:04:05"
  json_timezone = "UTC"

[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["q2_results_6h"]
  consumer_group = "telegraf-q2-6h"
  offset = "oldest"

  data_format = "json"
  name_override = "q2_6h"
  tag_keys = ["origin_airport_id", "airport_rank"]
  json_string_fields = ["delayed_flights"]
  json_time_key = "ts"
  json_time_format = "2006-01-02 15:04:05"
  json_timezone = "UTC"

[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["q2_results_global"]
  consumer_group = "telegraf-q2-global"
  offset = "oldest"

  data_format = "json"
  name_override = "q2_global"
  tag_keys = ["origin_airport_id", "airport_rank"]
  json_string_fields = ["delayed_flights"]
  json_time_key = "ts"
  json_time_format = "2006-01-02 15:04:05"
  json_timezone = "UTC"

# ── Q2 cumulative: rank live sovrascritto per airport_rank ──────────────────

[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["q2_results_cumulative"]
  consumer_group = "telegraf-q2-cumulative"
  offset = "oldest"

  data_format = "json"
  name_override = "q2_cumulative"
  tag_keys = ["airport_rank"]
  json_string_fields = ["delayed_flights"]
  json_time_key = "ts"
  json_time_format = "2006-01-02 15:04:05"
  json_timezone = "UTC"

# ── Q3: un consumer per finestra (consumer group separati) ──────────────────

[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["q3_results_1d"]
  consumer_group = "telegraf-q3-1d"
  offset = "oldest"

  data_format = "json"
  name_override = "q3_1d"
  tag_keys = ["airline", "hour"]
  json_time_key = "ts"
  json_time_format = "2006-01-02 15:04:05"
  json_timezone = "UTC"

[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["q3_results_7d"]
  consumer_group = "telegraf-q3-7d"
  offset = "oldest"

  data_format = "json"
  name_override = "q3_7d"
  tag_keys = ["airline", "hour"]
  json_time_key = "ts"
  json_time_format = "2006-01-02 15:04:05"
  json_timezone = "UTC"

[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["q3_results_global"]
  consumer_group = "telegraf-q3-global"
  offset = "oldest"

  data_format = "json"
  name_override = "q3_global"
  tag_keys = ["airline", "hour"]
  json_time_key = "ts"
  json_time_format = "2006-01-02 15:04:05"
  json_timezone = "UTC"

[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["q3_results_cumulative"]
  consumer_group = "telegraf-q3-cumulative"
  offset = "oldest"

  data_format = "json"
  name_override = "q3_cumulative"
  tag_keys = ["airline", "hour"]
  json_time_key = "ts"
  json_time_format = "2006-01-02 15:04:05"
  json_timezone = "UTC"

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
