extends: "../base.yml"

# Famiglia wm_uniform (vedi 02_wm_uniform_d0): D = 3600 = W, cambia solo d.
#
# d = 1800 = D/2: punto intermedio della curva completezza/latenza.
# Perdita attesa: loss = p * (D - d)^2 / (2 * D * W)
#              = 0.3 * 1800^2 / (2 * 3600 * 3600) = 3.75%

experiment:
  name: "04_wm_uniform_d1800"
  output_dir_host: "Results/experiments"

producer:
  holdback_probability: 0.3
  holdback_delay: 3600.0
  holdback_distribution: "uniform"

flink:
  auto_watermark_interval_ms: 1
  python_bundle_time_ms: 50       # bundle Python: watermark quantizzato a ~576 s event (vs 16 h col default 1000 ms)

# Stesso ritardo ammesso per tutte le query.
q1:
  watermark_delay_seconds: 1800
q2:
  window: "1h"   # 1h | 6h | global | all
  watermark_delay_seconds: 1800

