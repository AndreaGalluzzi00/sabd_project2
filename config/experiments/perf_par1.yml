extends: "../base.yml"


experiment:
  name: "perf_par1"
  output_dir_host: "Results/experiments"

producer:
  holdback_probability: 0.0

flink:
  parallelism: 1

q1:
  watermark_delay_seconds: 30
q2:
  window: "1h"   # 1h | 6h | global | all
  watermark_delay_seconds: 30
q3:
  window: "1d"  # 1d | 7d | global | all
  watermark_delay_seconds: 30
