extends: "../base.yml"

# Config TEMPORANEA di validazione del late-drop su Q3 (flink/table, job.py).
# Watermark Q3 volutamente minuscolo + holdback alto → forza record in ritardo,
# così il contatore numLateRecordsDropped del side output deve risultare > 0.
# Non è un esperimento del report: eliminabile dopo la verifica.

experiment:
  name: "_val_q3late"
  output_dir_host: "Results/experiments"

producer:
  holdback_probability: 0.5
  holdback_delay: 120.0
  holdback_distribution: "exponential"
  holdback_mean_seconds: 40.0

q3:
  watermark_delay_seconds: 1

# Solo CSV + blackhole: isola il test del late-drop dai sink dashboard.
dashboard:
  influx:
    enabled: false
  timescale:
    enabled: false
