# ============================================================
# SABD Project 2 - Real-time Flight Analysis Stack
# Kafka (KRaft) + Apache Flink + Kafka UI
#
# Infrastruttura:
#   docker compose up -d
#
# Moduli manuali:
#   docker compose run --rm kafka-init
#   docker compose run --rm preprocess
#   docker compose run --rm flink-job-q1
#   docker compose run --rm flink-job-q1-ds
#   docker compose run --rm flink-job-q2
#   docker compose run --rm flink-job-q3
#   docker compose --profile manual up -d spark-job-q1 spark-job-q2 spark-job-q3
#   docker compose run --rm producer
#
# Chiusura pulita dei job (dopo che il producer ha finito):
#   docker exec flink-jobmanager flink list -r
#   docker exec flink-jobmanager flink stop --drain -p /opt/flink/savepoints <JOB_ID_Q1>
#   docker exec flink-jobmanager flink stop --drain -p /opt/flink/savepoints <JOB_ID_Q2>
#   docker exec flink-jobmanager flink stop --drain -p /opt/flink/savepoints <JOB_ID_Q3>
#   python scripts/merge_q1.py
#   python scripts/merge_q2.py
#   python scripts/merge_q3.py
#   python scripts/merge_spark_q1.py
#   python scripts/merge_spark_q2.py
#   python scripts/merge_spark_q3.py
#
# Configurazione applicativa:
#   config/base.yml
#
# Il compose monta ./config dentro i container in /config.
# I servizi Python/Flink leggono CONFIG_PATH=/config/base.yml.
# ============================================================

name: sabd_project2

services:


#CONTAINER INFRATRUTTURALI
  # ----------------------------------------------------------
  # Apache Kafka 3.7 in KRaft mode
  # Single-node broker + controller
  # ----------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093

      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT

      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk

      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_NUM_PARTITIONS=4
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1

      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1

      - KAFKA_LOG_RETENTION_HOURS=48
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - sabd-net

  # ----------------------------------------------------------
  # Apache Kafka 3.7 - Second broker (broker-only, no controller)
  # Needed for replication-factor 2 on the flights topic.
  # ----------------------------------------------------------
  kafka2:
    image: apache/kafka:3.7.0
    hostname: kafka2
    container_name: kafka2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_NODE_ID=2
      - KAFKA_PROCESS_ROLES=broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093

      - KAFKA_LISTENERS=PLAINTEXT://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka2:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT

      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk

      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_LOG_RETENTION_HOURS=48
    volumes:
      - kafka2_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - sabd-net

  # ----------------------------------------------------------
  # Confluent Schema Registry
  # Manages Avro schemas; producer and Flink avro-confluent
  # format both resolve schemas from here.
  # ----------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8082:8081"
    environment:
      - SCHEMA_REGISTRY_HOST_NAME=schema-registry
      - SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS=kafka:9092
      - SCHEMA_REGISTRY_LISTENERS=http://0.0.0.0:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - sabd-net

  # ----------------------------------------------------------
  # Schema Init: registers flight.avsc in Schema Registry
  # Runs once at startup (restart: no).
  # ----------------------------------------------------------
  schema-init:
    image: python:3.11-slim
    container_name: schema-init
    depends_on:
      schema-registry:
        condition: service_healthy
    command: >
      bash -c "
        pip install --quiet requests &&
        python -c \"import requests,sys; s=open('/schema/flight.avsc').read(); r=requests.post('http://schema-registry:8081/subjects/flights-value/versions',json={'schema':s},headers={'Content-Type':'application/vnd.schemaregistry.v1+json'}); print('Schema registered (or already exists). ID:',r.json().get('id','N/A')) if r.status_code in (200,409) else (print('ERROR:',r.status_code,r.text) or sys.exit(1))\"
      "
    volumes:
      - ./schema:/schema:ro
    networks:
      - sabd-net
    restart: "no"

  # ----------------------------------------------------------
  # Apache Flink - JobManager
  # ----------------------------------------------------------
  flink-jobmanager:
    build:
      context: .
      dockerfile: flink_jobs/Dockerfile
    platform: linux/amd64
    hostname: flink-jobmanager
    container_name: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      CONFIG_PATH: /config/base.yml
      PYTHONPATH: /opt/flink/jobs:/opt/flink/jobs/q1:/opt/flink/jobs/q2:/opt/flink/jobs/q3:/opt/flink
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1600m
        rest.bind-port: 8081
        metrics.reporters: slf4j
        state.savepoints.dir: file:///opt/flink/savepoints
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.checkpoint-storage: filesystem
    volumes:
      - ./config:/config:ro
      - ./flink_jobs:/opt/flink/jobs:ro
      - ./common:/opt/flink/common:ro
      - ./Results:/opt/flink/results
      - ./flink-savepoints:/opt/flink/savepoints
      - ./flink-checkpoints:/opt/flink/checkpoints
    networks:
      - sabd-net

  # ----------------------------------------------------------
  # Apache Flink - TaskManager
  # ----------------------------------------------------------
  flink-taskmanager:
    build:
      context: .
      dockerfile: flink_jobs/Dockerfile
    platform: linux/amd64
    hostname: flink-taskmanager
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      CONFIG_PATH: /config/base.yml
      PYTHONPATH: /opt/flink/jobs:/opt/flink/jobs/q1:/opt/flink/jobs/q2:/opt/flink/jobs/q3:/opt/flink
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 2560m
        taskmanager.memory.jvm-metaspace.size: 512m
        taskmanager.numberOfTaskSlots: 4
        metrics.reporters: slf4j
        state.savepoints.dir: file:///opt/flink/savepoints
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.checkpoint-storage: filesystem
    volumes:
      - ./config:/config:ro
      - ./flink_jobs:/opt/flink/jobs:ro
      - ./common:/opt/flink/common:ro
      - ./Results:/opt/flink/results
      - ./flink-savepoints:/opt/flink/savepoints
      - ./flink-checkpoints:/opt/flink/checkpoints
    networks:
      - sabd-net

  # ----------------------------------------------------------
  # Kafka UI - monitoring/debugging
  # http://localhost:8080
  # ----------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=sabd-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_SCHEMAREGISTRY=http://schema-registry:8081
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    networks:
      - sabd-net

  # ==========================================================
  # MODULI MANUALI - profile: manual
  # ==========================================================

  # ----------------------------------------------------------
  # [1] Crea il topic flights su Kafka
  # ----------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    profiles: ["manual"]
    depends_on:
      kafka:
        condition: service_healthy
      kafka2:
        condition: service_healthy
    command: >
      /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:9092
        --create
        --if-not-exists
        --topic flights
        --partitions 4
        --replication-factor 1
        --config retention.ms=172800000
        --config max.message.bytes=2097152
    networks:
      - sabd-net
    restart: "no"

  # ----------------------------------------------------------
  # [2] Preprocessing: CSV -> CSV ordinato per event_time
  # ----------------------------------------------------------
  preprocess:
    build:
      context: .
      dockerfile: preprocessing/Dockerfile
    container_name: preprocess
    profiles: ["manual"]
    environment:
      CONFIG_PATH: /config/base.yml
    volumes:
      - ./config:/config:ro
      - ./data:/data:ro
      - prepared:/prepared
    networks:
      - sabd-net
    restart: "no"

  # ----------------------------------------------------------
  # [3] Flink Q1: sottomette il job PyFlink al cluster
  # ----------------------------------------------------------
  flink-job-q1:
    build:
      context: .
      dockerfile: flink_jobs/Dockerfile
    platform: linux/amd64
    container_name: flink-job-q1
    profiles: ["manual"]
    depends_on:
      - flink-taskmanager
    environment:
      CONFIG_PATH: /config/base.yml
      PYTHONPATH: /opt/flink/jobs:/opt/flink/jobs/q1:/opt/flink/jobs/q2:/opt/flink/jobs/q3:/opt/flink
    command: >
      bash -c "
        echo 'Waiting for Flink JobManager...' &&
        until curl -sf http://flink-jobmanager:8081/overview > /dev/null; do sleep 2; done &&
        echo 'Preparing Q1 output directory...' &&
        python -c \"from pathlib import Path; from common.config import load_config; p = Path(load_config()['paths']['q1_results_path']); p.mkdir(parents=True, exist_ok=True); print(f'Q1 output directory ready: {p}')\" &&
        echo 'Submitting Q1 job...' &&
        flink run -d -m flink-jobmanager:8081 -py /opt/flink/jobs/q1/job.py
      "
    volumes:
      - ./config:/config:ro
      - ./flink_jobs:/opt/flink/jobs:ro
      - ./common:/opt/flink/common:ro
      - ./Results:/opt/flink/results
      - ./flink-savepoints:/opt/flink/savepoints
      - ./flink-checkpoints:/opt/flink/checkpoints
    networks:
      - sabd-net
    restart: "no"

  # ----------------------------------------------------------
  # [3b] Flink Q1 DataStream: reimplementazione DataStream API
  # Produce gli stessi risultati di flink-job-q1 in q1_ds/
  # per confronto architetturale Table API vs DataStream API.
  # ----------------------------------------------------------
  flink-job-q1-ds:
    build:
      context: .
      dockerfile: flink_jobs/Dockerfile
    platform: linux/amd64
    container_name: flink-job-q1-ds
    profiles: ["manual"]
    depends_on:
      - flink-taskmanager
    environment:
      CONFIG_PATH: /config/base.yml
      PYTHONPATH: /opt/flink/jobs:/opt/flink/jobs/q1:/opt/flink/jobs/q2:/opt/flink/jobs/q3:/opt/flink
    command: >
      bash -c "
        echo 'Waiting for Flink JobManager...' &&
        until curl -sf http://flink-jobmanager:8081/overview > /dev/null; do sleep 2; done &&
        echo 'Preparing Q1-DS output directory...' &&
        rm -rf /opt/flink/results/q1_ds &&
        python -c \"from pathlib import Path; from common.config import load_config; p = Path(load_config()['paths']['q1_ds_results_path']); p.mkdir(parents=True, exist_ok=True); print(f'Q1-DS output directory ready: {p}')\" &&
        echo 'Submitting Q1-DS job (DataStream API)...' &&
        flink run -d -m flink-jobmanager:8081 -py /opt/flink/jobs/q1/job_datastream.py
      "
    volumes:
      - ./config:/config:ro
      - ./flink_jobs:/opt/flink/jobs:ro
      - ./common:/opt/flink/common:ro
      - ./Results:/opt/flink/results
      - ./flink-savepoints:/opt/flink/savepoints
      - ./flink-checkpoints:/opt/flink/checkpoints
    networks:
      - sabd-net
    restart: "no"

  # ----------------------------------------------------------
  # [3c] Flink Q2: sottomette il job PyFlink al cluster
  # ----------------------------------------------------------
  flink-job-q2:
    build:
      context: .
      dockerfile: flink_jobs/Dockerfile
    platform: linux/amd64
    container_name: flink-job-q2
    profiles: ["manual"]
    depends_on:
      - flink-taskmanager
    environment:
      CONFIG_PATH: /config/base.yml
      PYTHONPATH: /opt/flink/jobs:/opt/flink/jobs/q1:/opt/flink/jobs/q2:/opt/flink/jobs/q3:/opt/flink
    command: >
      bash -c "
        echo 'Waiting for Flink JobManager...' &&
        until curl -sf http://flink-jobmanager:8081/overview > /dev/null; do sleep 2; done &&
        echo 'Preparing Q2 output directories...' &&
        python -c \"from pathlib import Path; from common.config import load_config; cfg=load_config()['paths']; [Path(cfg[k]).mkdir(parents=True,exist_ok=True) or print(f'Ready: {Path(cfg[k])}') for k in ['q2_results_path_1h','q2_results_path_6h','q2_results_path_global']]\" &&
        echo 'Submitting Q2 job...' &&
        flink run -d -m flink-jobmanager:8081 -py /opt/flink/jobs/q2/job.py
      "
    volumes:
      - ./config:/config:ro
      - ./flink_jobs:/opt/flink/jobs:ro
      - ./common:/opt/flink/common:ro
      - ./Results:/opt/flink/results
      - ./flink-savepoints:/opt/flink/savepoints
      - ./flink-checkpoints:/opt/flink/checkpoints
    networks:
      - sabd-net
    restart: "no"

  # ----------------------------------------------------------
  # [3d] Flink Q2 DataStream: reimplementazione DataStream API
  # Produce gli stessi risultati di flink-job-q2 in q2_ds/
  # per confronto architetturale Table API vs DataStream API.
  # ----------------------------------------------------------
  flink-job-q2-ds:
    build:
      context: .
      dockerfile: flink_jobs/Dockerfile
    platform: linux/amd64
    container_name: flink-job-q2-ds
    profiles: ["manual"]
    depends_on:
      - flink-taskmanager
    environment:
      CONFIG_PATH: /config/base.yml
      PYTHONPATH: /opt/flink/jobs:/opt/flink/jobs/q1:/opt/flink/jobs/q2:/opt/flink
    command: >
      bash -c "
        echo 'Waiting for Flink JobManager...' &&
        until curl -sf http://flink-jobmanager:8081/overview > /dev/null; do sleep 2; done &&
        echo 'Preparing Q2-DS output directories...' &&
        rm -rf /opt/flink/results/q2_ds &&
        python -c \"from pathlib import Path; from common.config import load_config; cfg=load_config()['paths']; [Path(cfg[k]).mkdir(parents=True,exist_ok=True) or print(f'Ready: {Path(cfg[k])}') for k in ['q2_ds_results_path_1h','q2_ds_results_path_6h','q2_ds_results_path_global']]\" &&
        echo 'Submitting Q2-DS job (DataStream API)...' &&
        flink run -d -m flink-jobmanager:8081 -py /opt/flink/jobs/q2/job_datastream.py
      "
    volumes:
      - ./config:/config:ro
      - ./flink_jobs:/opt/flink/jobs:ro
      - ./common:/opt/flink/common:ro
      - ./Results:/opt/flink/results
      - ./flink-savepoints:/opt/flink/savepoints
      - ./flink-checkpoints:/opt/flink/checkpoints
    networks:
      - sabd-net
    restart: "no"


  # [3d] Flink Q3: sottomette il job PyFlink al cluster
  # ----------------------------------------------------------
  flink-job-q3:
    build:
      context: .
      dockerfile: flink_jobs/Dockerfile
    platform: linux/amd64
    container_name: flink-job-q3
    profiles: ["manual"]
    depends_on:
      - flink-taskmanager
    environment:
      CONFIG_PATH: /config/base.yml
      PYTHONPATH: /opt/flink/jobs:/opt/flink/jobs/q1:/opt/flink/jobs/q2:/opt/flink/jobs/q3:/opt/flink
    command: >
      bash -c "
        echo 'Waiting for Flink JobManager...' &&
        until curl -sf http://flink-jobmanager:8081/overview > /dev/null; do sleep 2; done &&
        echo 'Preparing Q3 output directories...' &&
        python -c \"from pathlib import Path; from common.config import load_config; cfg=load_config()['paths']; [Path(cfg[k]).mkdir(parents=True,exist_ok=True) or print(f'Ready: {Path(cfg[k])}') for k in ['q3_results_path_1d','q3_results_path_7d','q3_results_path_global']]\" &&
        echo 'Submitting Q3 job...' &&
        flink run -d -m flink-jobmanager:8081 -py /opt/flink/jobs/q3/job.py
      "
    volumes:
      - ./config:/config:ro
      - ./flink_jobs:/opt/flink/jobs:ro
      - ./common:/opt/flink/common:ro
      - ./Results:/opt/flink/results
      - ./flink-savepoints:/opt/flink/savepoints
      - ./flink-checkpoints:/opt/flink/checkpoints
    networks:
      - sabd-net
    restart: "no"

  # ----------------------------------------------------------
  # [4] Producer: replay eventi su Kafka
  # Serializes every event in Confluent Avro format and publishes
  # directly to Kafka. EOS markers are sent to Kafka as well.
  # ----------------------------------------------------------
  producer:
    build:
      context: .
      dockerfile: production/Dockerfile
    container_name: producer
    profiles: ["manual"]
    depends_on:
      kafka:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
    environment:
      CONFIG_PATH: /config/base.yml
    volumes:
      - ./config:/config:ro
      - prepared:/prepared:ro
      - ./Results:/opt/flink/results
    networks:
      - sabd-net
    restart: "no"

  # ----------------------------------------------------------
  # [5a] Spark Structured Streaming Q1 (extra)
  # Long-running local Spark job: start it before the producer with
  # docker compose --profile manual up -d spark-job-q1
  # ----------------------------------------------------------
  spark-job-q1:
    build:
      context: .
      dockerfile: spark_jobs/Dockerfile
    platform: linux/amd64
    container_name: spark-job-q1
    profiles: ["manual"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      CONFIG_PATH: ${SABD_CONFIG_PATH:-/config/base.yml}
      PYTHONPATH: /opt/spark/app:/opt/spark/app/spark_jobs:/opt/spark/app/common
      SPARK_PACKAGES: org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.apache.spark:spark-avro_2.12:3.5.1
    command: >
      bash -c "
        echo 'Preparing Spark Q1 output/checkpoint directories...' &&
        rm -rf /opt/spark/results/spark/q1 /opt/spark/checkpoints/q1 &&
        mkdir -p /opt/spark/results/spark/q1 /opt/spark/checkpoints &&
        echo 'Starting Spark Structured Q1...' &&
        /opt/spark/bin/spark-submit --master local[*] --packages \"$$SPARK_PACKAGES\" /opt/spark/app/spark_jobs/q1/job.py
      "
    volumes:
      - ./config:/config:ro
      - ./common:/opt/spark/app/common:ro
      - ./schema:/opt/spark/app/schema:ro
      - ./spark_jobs:/opt/spark/app/spark_jobs:ro
      - ./Results:/opt/spark/results
      - ./spark-checkpoints:/opt/spark/checkpoints
    networks:
      - sabd-net
    restart: "no"

  # ----------------------------------------------------------
  # [5b] Spark Structured Streaming Q2 (extra)
  # ----------------------------------------------------------
  spark-job-q2:
    build:
      context: .
      dockerfile: spark_jobs/Dockerfile
    platform: linux/amd64
    container_name: spark-job-q2
    profiles: ["manual"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      CONFIG_PATH: ${SABD_CONFIG_PATH:-/config/base.yml}
      PYTHONPATH: /opt/spark/app:/opt/spark/app/spark_jobs:/opt/spark/app/common
      SPARK_PACKAGES: org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.apache.spark:spark-avro_2.12:3.5.1
    command: >
      bash -c "
        echo 'Preparing Spark Q2 output/checkpoint directories...' &&
        rm -rf /opt/spark/results/spark/q2 /opt/spark/checkpoints/q2 &&
        mkdir -p /opt/spark/results/spark/q2 /opt/spark/checkpoints &&
        echo 'Starting Spark Structured Q2...' &&
        /opt/spark/bin/spark-submit --master local[*] --packages \"$$SPARK_PACKAGES\" /opt/spark/app/spark_jobs/q2/job.py
      "
    volumes:
      - ./config:/config:ro
      - ./common:/opt/spark/app/common:ro
      - ./schema:/opt/spark/app/schema:ro
      - ./spark_jobs:/opt/spark/app/spark_jobs:ro
      - ./Results:/opt/spark/results
      - ./spark-checkpoints:/opt/spark/checkpoints
    networks:
      - sabd-net
    restart: "no"

  # ----------------------------------------------------------
  # [5c] Spark Structured Streaming Q3 (extra)
  # Uses Spark percentile_approx for approximate quantiles.
  # ----------------------------------------------------------
  spark-job-q3:
    build:
      context: .
      dockerfile: spark_jobs/Dockerfile
    platform: linux/amd64
    container_name: spark-job-q3
    profiles: ["manual"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      CONFIG_PATH: ${SABD_CONFIG_PATH:-/config/base.yml}
      PYTHONPATH: /opt/spark/app:/opt/spark/app/spark_jobs:/opt/spark/app/common
      SPARK_PACKAGES: org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.apache.spark:spark-avro_2.12:3.5.1
    command: >
      bash -c "
        echo 'Preparing Spark Q3 output/checkpoint directories...' &&
        rm -rf /opt/spark/results/spark/q3 /opt/spark/checkpoints/q3 &&
        mkdir -p /opt/spark/results/spark/q3 /opt/spark/checkpoints &&
        echo 'Starting Spark Structured Q3...' &&
        /opt/spark/bin/spark-submit --master local[*] --packages \"$$SPARK_PACKAGES\" /opt/spark/app/spark_jobs/q3/job.py
      "
    volumes:
      - ./config:/config:ro
      - ./common:/opt/spark/app/common:ro
      - ./schema:/opt/spark/app/schema:ro
      - ./spark_jobs:/opt/spark/app/spark_jobs:ro
      - ./Results:/opt/spark/results
      - ./spark-checkpoints:/opt/spark/checkpoints
    networks:
      - sabd-net
    restart: "no"

  # ==========================================================
  # DASHBOARD REAL-TIME (Opzionale 1)
  # Due backend ALTERNATIVI, attivabili separatamente o insieme:
  #
  #   profile dashboard-influx     (time-series nativo)
  #     Flink Q1 --(topic q1_results)--> Telegraf --> InfluxDB --> Grafana
  #
  #   profile dashboard-timescale  (SQL, sink JDBC nativo di Flink)
  #     Flink Q1 --(JDBC)--> TimescaleDB --> Grafana
  #
  # Grafana è condiviso (in entrambi i profili) e provisiona entrambe le
  # dashboard/datasource: confronto fianco a fianco per la presentazione.
  #
  #   docker compose --profile dashboard-influx up -d
  #   docker compose --profile dashboard-timescale up -d
  #   docker compose --profile dashboard-influx --profile dashboard-timescale up -d
  #
  # Grafana: http://localhost:3000 (admin/admin) · InfluxDB: :8086 (admin/admin12345)
  # TimescaleDB: :5432 (sabd/sabd). Credenziali SOLO per uso locale/demo.
  # ==========================================================

  # ----------------------------------------------------------
  # [D0] Crea i topic dei risultati (Q1/Q2/Q3) consumati da Telegraf.
  # Topic a bassa voluminosità: 1 partizione (ordine preservato), RF 1.
  # q1_results resta a 4 partizioni per compatibilità con i run esistenti.
  # ----------------------------------------------------------
  dashboard-init:
    image: apache/kafka:3.7.0
    container_name: sabd2-dashboard-init
    profiles: ["dashboard-influx"]
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        create() { /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic \"$$1\" --partitions \"$$2\" --replication-factor 1; };
        create q1_results 4 &&
        create q2_results_1h 1 && create q2_results_6h 1 && create q2_results_global 1 &&
        create q3_results_1d 1 && create q3_results_7d 1 && create q3_results_global 1
      "
    networks:
      - sabd-net
    restart: "no"

  # ----------------------------------------------------------
  # [D1] InfluxDB 2.x - time-series store delle metriche di query
  # Retention infinita (0s): l'event-time del replay è nel 2025,
  # una retention finita scarterebbe i punti perché già "vecchi".
  # ----------------------------------------------------------
  influxdb:
    image: influxdb:2.7
    container_name: sabd2-influxdb
    profiles: ["dashboard-influx"]
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin12345
      - DOCKER_INFLUXDB_INIT_ORG=sabd
      - DOCKER_INFLUXDB_INIT_BUCKET=flights
      - DOCKER_INFLUXDB_INIT_RETENTION=0s
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=sabd-dev-token-please-change
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - sabd-net

  # ----------------------------------------------------------
  # [D2] Telegraf - consuma q1_results da Kafka e scrive su InfluxDB
  # ----------------------------------------------------------
  telegraf:
    image: telegraf:1.30
    container_name: sabd2-telegraf
    profiles: ["dashboard-influx"]
    depends_on:
      kafka:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=sabd-dev-token-please-change
      - INFLUX_ORG=sabd
      - INFLUX_BUCKET=flights
    volumes:
      - ./dashboard/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    networks:
      - sabd-net
    restart: unless-stopped

  # ----------------------------------------------------------
  # [D3] TimescaleDB - store SQL (Postgres + estensione time-series).
  # L'init in /docker-entrypoint-initdb.d crea tabella + hypertable al
  # primo avvio (il sink JDBC di Flink NON crea tabelle).
  # ----------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:2.15.3-pg16
    container_name: sabd2-timescaledb
    profiles: ["dashboard-timescale"]
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=sabd
      - POSTGRES_PASSWORD=sabd
      - POSTGRES_DB=sabd
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./dashboard/timescaledb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabd -d sabd"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - sabd-net

  # ----------------------------------------------------------
  # [D4] Grafana - condiviso da entrambi i profili.
  # Provisiona i due datasource (InfluxDB/Flux + TimescaleDB/SQL) e le due
  # dashboard. Niente depends_on sui DB: un datasource non raggiungibile dà
  # solo errore sui pannelli relativi, non blocca l'avvio.
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: sabd2-grafana
    profiles: ["dashboard-influx", "dashboard-timescale"]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./dashboard/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboard/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - sabd-net

volumes:
  kafka_data:
  kafka2_data:
  prepared:
  influxdb_data:
  grafana_data:
  timescaledb_data:
  spark-checkpoints:

networks:
  sabd-net:
    driver: bridge
