extends: "../base.yml"

experiment:
  name: "baseline"
  output_dir_host: "Results/experiments"

producer:
  holdback_probability: 0.0

# Nessun disordine iniettato -> sanity check: attesi 0 late drop.
# Il ritardo ammesso vale per tutte le query (q2/q3 non devono ereditare
# il default di base.yml).
q1:
  watermark_delay_seconds: 30
q2:
  window: "cumulative"   # 1h | 6h | global | all | cumulative
  watermark_delay_seconds: 30
q3:
  window: "1d"  # 1d | 7d | global | all  cumulative
  watermark_delay_seconds: 30
