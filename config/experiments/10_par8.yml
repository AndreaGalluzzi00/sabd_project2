extends: "../base.yml"

# Sweep parallelismo — vedi 07_par1.yml per la motivazione. Parallelismo 8
# (usa tutti gli 8 slot del TaskManager). Con il topic 'flights' a 4 partizioni
# il source resta a parallelismo effettivo 4; gli operatori a valle (finestre,
# aggregazioni) scalano a 8: utile per osservare dove il parallelismo aiuta.

experiment:
  name: "10_par8"
  output_dir_host: "Results/experiments"

producer:
  holdback_probability: 0.0

flink:
  parallelism: 8
