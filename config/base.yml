experiment:
  name: "base"

paths:
  raw_dataset_path: "/data/raw/project-2-data"
  prepared_path: "/prepared/flights_prepared.csv"
  flink_results_root: "/opt/flink/results"
  spark_results_root: "/opt/spark/results"
  host_results_root: "Results"

kafka:
  bootstrap_servers: "kafka:9092"
  topic: "flights"

schema_registry:
  url: "http://schema-registry:8081"
  subject: "flights-value"

preprocessing:
  numeric_missing_policy: "null"  # "null" oppure "zero"

producer:
  acceleration_factor: 57600
  log_interval: 100000
  flush_interval: 5000
  skip_if_topic_has_messages: true

  # Iniezione di out-of-orderness: non modifica l'event_time,
  # ritarda solo la consegna degli eventi.
  holdback_probability: 0.3
  holdback_delay: 120.0
  random_seed: 42

  # uniform: delay casuale in [0, holdback_delay]
  # exponential: molti delay piccoli, pochi delay grandi
  holdback_distribution: "exponential"

  # Usato solo con holdback_distribution = "exponential".
  holdback_mean_seconds: 40.0

  # A fine replay invia un marker con event_time nel futuro a ogni partizione:
  # spinge il watermark oltre l'ultima finestra e drena i risultati finali.
  emit_end_of_stream: true
  retries: 3
  linger_ms: 20
  batch_size: 32768
  max_in_flight_requests_per_connection: 1
  acks: "all"

flink:
  parallelism: 4
  checkpoint_interval_ms: 10000
  consumer_group: "flink-flight-analysis"

  # Intervallo di emissione periodica del watermark.
  # A 57600x, 200ms corrispondono a circa 3.2h di event-time.
  auto_watermark_interval_ms: 200

spark:
  consumer_group: "spark-flight-analysis"
  checkpoint_base_path: "/opt/spark/checkpoints"
  shuffle_partitions: 4
  trigger_processing_time: "5 seconds"
  idle_timeout_seconds: 60
  startup_timeout_seconds: 900
  # Optional throttle for experiments, e.g. 200000. null -> Spark default.
  max_offsets_per_trigger:

q1:
  watermark_delay_seconds: 180

q2:
  # Ritardo massimo ammesso per eventi in ritardo (event time).
  watermark_delay_seconds: 180

q3:
  # Stessa strategia di watermarking di Q1/Q2.
  watermark_delay_seconds: 180
  # DDSketch: errore relativo massimo garantito sui percentili.
  sketch_alpha: 0.01
  # Spark Structured Streaming extra: percentile_approx accuracy.
  spark_percentile_accuracy: 10000

# Visualizzazione real-time su Grafana (opzionale).
# Il sink CSV resta sempre attivo; dashboard InfluxDB/TimescaleDB sono sink paralleli.
dashboard:
  influx:
    enabled: true
    # NB: con enabled=true i topic DEVONO esistere (vedi servizio dashboard-init).
    results_topic: "q1_results"
    q2:
      topic_1h: "q2_results_1h"
      topic_6h: "q2_results_6h"
      topic_global: "q2_results_global"
    q3:
      topic_1d: "q3_results_1d"
      topic_7d: "q3_results_7d"
      topic_global: "q3_results_global"
  timescale:
    enabled: true
    # NB: con enabled=true le tabelle DEVONO esistere (init in dashboard/timescaledb/).
    url: "jdbc:postgresql://timescaledb:5432/sabd"
    table: "q1_results"
    username: "sabd"
    password: "sabd"
    q2:
      table_1h: "q2_results_1h"
      table_6h: "q2_results_6h"
      table_global: "q2_results_global"
    q3:
      table_1d: "q3_results_1d"
      table_7d: "q3_results_7d"
      table_global: "q3_results_global"
