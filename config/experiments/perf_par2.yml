extends: "../base.yml"

# Sweep di parallelismo (vedi perf_par1.yml per razionale e caveat).
# Baseline fisso, cambia solo flink.parallelism. Query a runtime.

experiment:
  name: "perf_par2"
  output_dir_host: "Results/experiments"

producer:
  holdback_probability: 0.0

flink:
  parallelism: 2

q1:
  watermark_delay_seconds: 30
q2:
  watermark_delay_seconds: 30
q3:
  watermark_delay_seconds: 30
