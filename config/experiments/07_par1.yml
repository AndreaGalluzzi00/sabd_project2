extends: "../base.yml"

# Sweep del parallelismo (1/2/4/8) per valutarne l'impatto su throughput e
# latenza (requisito core della specifica). Scenario baseline SENZA disordine
# (holdback_probability = 0) per isolare l'effetto del solo parallelismo:
# tutti gli eventi rientrano nelle finestre, completezza ~100%.
# Raccogli le metriche con scripts/report_perf.py (Flink) / spark_runtime (Spark)
# -> Results/perf.csv, poi confronta le righe a parità di query.
# NB: il TaskManager ha 8 slot (docker-compose.yml), quindi parallelismo <= 8.

experiment:
  name: "07_par1"
  output_dir_host: "Results/experiments"

producer:
  holdback_probability: 0.0

flink:
  parallelism: 1
